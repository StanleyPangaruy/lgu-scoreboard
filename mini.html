<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lopez Mini Scoreboard</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    cursor: none;
    font-family: var(--font-display);
    font-stretch: 75%;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--white);
    user-select: none;
  }
  /* ?bg=1 — test backdrop only, never used in OBS/vMix */
  body.test-bg { background: linear-gradient(135deg, #7a5a3a, #3d4a3a 60%, #555); }

  /* Corner comes from ?pos=tl, tr, bl or br; the script defaults to bl (bottom left). */
  .mini-wrap {
    position: absolute;
    top: 48px;
    right: 48px;
    transition: opacity 350ms ease, transform 350ms ease;
  }
  .mini {
    border-radius: 8px;
    overflow: hidden;
    border: 3px solid var(--board-accent);
    background: var(--board-deep);
  }
  .mini-body { display: flex; height: 124px; }

  /* Tournament title strip. width:0 + min-width:100% stops a long title widening the box. */
  .title {
    width: 0;
    min-width: 100%;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--board-deep);
    font-size: 17px;
    line-height: 1;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .title.empty { display: none; }
  .title span { display: inline-block; padding-top: 2px; }
  .mini-wrap.pos-tl { right: auto; left: 48px; }
  .mini-wrap.pos-bl { top: auto; bottom: 48px; right: auto; left: 48px; }
  .mini-wrap.pos-br { top: auto; bottom: 48px; }
  .mini-wrap.hidden { opacity: 0; transform: translateY(-16px); }
  .mini-wrap.pos-bl.hidden, .mini-wrap.pos-br.hidden { transform: translateY(16px); }

  /* Scoring run tab ("LUCBAN 10-0 RUN"). It hangs off the scoreboard on the side facing the
     middle of the screen: above it in the bottom corners, below it in the top corners. */
  .run {
    position: absolute;
    left: 0;
    top: calc(100% + 6px);
    height: 36px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-radius: 6px;
    border: 2px solid var(--board-accent);
    background: var(--board-deep);
    font-size: 24px;
    line-height: 1;
    white-space: nowrap;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 300ms ease, transform 300ms ease;
  }
  .pos-bl .run, .pos-br .run { top: auto; bottom: calc(100% + 6px); transform: translateY(10px); }
  .pos-tr .run, .pos-br .run { left: auto; right: 0; }
  .mini-wrap .run.on { opacity: 1; transform: none; }
  .run span { padding-top: 2px; }
  .run-count { color: var(--board-accent); }
  .run-time { font-size: 20px; }

  /* Left column: game clock over period + shot clock. */
  .time { width: 118px; display: flex; flex-direction: column; background: var(--board-deep); }
  .clock {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    line-height: 1;
  }
  .clock.warn { color: var(--shot-warn); }
  .status {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--board-accent);
    font-size: 30px;
    line-height: 1;
  }
  .shot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--board-accent);
    color: var(--board-deep);
    font-size: 20px;
  }
  .shot.warn { background: var(--white); color: var(--board-panel); }
  .shot.off { display: none; }

  .rows { display: flex; flex-direction: column; }
  .row { flex: 1; display: flex; }
  .row + .row { border-top: 2px solid var(--board-deep); }

  /* Vertical BONUS tab: lit gold for the team that gets to shoot. */
  .bonus {
    width: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--board-deep);
    color: color-mix(in srgb, var(--white) 25%, var(--board-deep));
    font-size: 13px;
    letter-spacing: 0.06em;
    transition: background 200ms ease, color 200ms ease;
  }
  .bonus span { transform: rotate(-90deg); white-space: nowrap; }
  .bonus.on { background: var(--board-accent); color: var(--board-deep); }

  .team {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 0 0;
    background: var(--board-panel);
  }
  .stripe { width: 5px; align-self: stretch; }
  .badge {
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--board-deep);
  }
  .badge img { width: 41px; height: 41px; object-fit: contain; opacity: 0; transition: opacity 250ms ease; }
  .badge img.ready { opacity: 1; }
  /* Full town name. All fit as they are except SAN FRANCISCO, which is squeezed to fit. */
  .who { width: 172px; display: flex; flex-direction: column; gap: 5px; }
  .name { font-size: 32px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  .name span { display: inline-block; transform-origin: left center; }

  /* Team fouls: five bars under the name, one lit per foul. */
  .fouls { display: flex; gap: 4px; }
  .fouls i { flex: 1; height: 6px; background: var(--board-panel-deep); }
  .fouls i.on { background: var(--white); }
  .poss {
    width: 0;
    height: 0;
    border: 8px solid transparent;
    border-left-color: var(--white);
    border-right-width: 0;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .poss.on { opacity: 1; }

  /* Timeouts left: a separate tab beside the scoreboard, not inside it (the operator asked
     for it to be kept out of the score box). One cell per team, level with that team's row.
     Numbers, so it works for any count. Shown or hidden by the operator. */
  .tos {
    position: absolute;
    left: calc(100% + 6px);
    bottom: 0;
    width: 52px;
    height: 130px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    border: 2px solid var(--board-accent);
    border-radius: 6px;
    overflow: hidden;
    background: var(--board-deep);
    line-height: 1;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 300ms ease, transform 300ms ease;
  }
  .pos-tr .tos, .pos-br .tos { left: auto; right: calc(100% + 6px); transform: translateX(10px); }
  .mini-wrap .tos.on { opacity: 1; transform: none; }
  .tos div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .tos div + div { border-top: 2px solid color-mix(in srgb, var(--white) 18%, var(--board-deep)); }
  .tos small { font-size: 12px; letter-spacing: 0.04em; color: var(--board-accent); }
  .tos b { font-size: 28px; font-weight: 700; }

  .score {
    position: relative;
    width: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    line-height: 1;
    background: var(--board-panel-deep);
  }
  .score::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--board-accent);
    opacity: 0;
  }
  .score.flash::after { animation: flash 400ms ease-out; }
  @keyframes flash { from { opacity: 0.85; } to { opacity: 0; } }
</style>
</head>
<body>
  <div class="mini-wrap hidden" id="mini">
  <div class="run" id="run"><span class="run-team"></span><span class="run-count"></span><span class="run-time"></span></div>
  <div class="tos" id="tos">
    <div><small>T.O.</small><b id="home-to">0</b></div>
    <div><small>T.O.</small><b id="away-to">0</b></div>
  </div>
  <div class="mini">
    <div class="title empty" id="title"><span></span></div>
    <div class="mini-body">
    <div class="time">
      <div class="clock" id="clock">10:00</div>
      <div class="status"><span id="period">1ST</span><span class="shot" id="shot">24</span></div>
    </div>
    <div class="rows">
      <div class="row" id="home">
        <div class="bonus"><span>BONUS</span></div>
        <div class="team">
          <div class="stripe"></div>
          <div class="badge"><img alt=""></div>
          <div class="who">
            <div class="name"><span></span></div>
            <div class="fouls"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="poss"></div>
        </div>
        <div class="score">0</div>
      </div>
      <div class="row" id="away">
        <div class="bonus"><span>BONUS</span></div>
        <div class="team">
          <div class="stripe"></div>
          <div class="badge"><img alt=""></div>
          <div class="who">
            <div class="name"><span></span></div>
            <div class="fouls"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="poss"></div>
        </div>
        <div class="score">0</div>
      </div>
    </div>
    </div>
  </div>
  </div>

<script src="logo-cutout.js"></script>
<script src="identity.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const RECONNECT_MS = 2000;
  const last = { home: null, away: null };

  const params = new URLSearchParams(location.search);
  if (params.has('bg')) document.body.classList.add('test-bg');
  // Bottom left unless ?pos= says otherwise.
  const pos = ['tl', 'tr', 'bl', 'br'].includes(params.get('pos')) ? params.get('pos') : 'bl';
  $('mini').classList.add('pos-' + pos);

  function formatGameClock(ms) {
    if (ms >= 60000) {
      const total = Math.ceil(ms / 1000);
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }
    const tenths = Math.floor(ms / 100);
    return Math.floor(tenths / 10) + '.' + (tenths % 10);
  }

  function formatShotClock(ms) {
    if (ms >= 5000) return String(Math.ceil(ms / 1000));
    const tenths = Math.floor(ms / 100);
    return Math.floor(tenths / 10) + '.' + (tenths % 10);
  }

  function periodLabel(p) {
    if (p <= 4) return p + ['ST', 'ND', 'RD', 'TH'][p - 1];
    return p === 5 ? 'OT' : (p - 4) + 'OT';
  }

  function renderTeam(side, team, other, state) {
    const row = $(side);
    const q = (sel) => row.querySelector(sel);
    q('.stripe').style.background = team.color;
    const name = q('.name span');
    if (name.textContent !== team.name) {
      name.textContent = team.name;
      name.style.transform = '';
      const room = q('.name').clientWidth;
      if (name.offsetWidth > room) name.style.transform = 'scaleX(' + room / name.offsetWidth + ')';
    }
    q('.poss').classList.toggle('on', state.possession === side);
    $(side + '-to').textContent = team.timeouts;
    [...q('.fouls').children].forEach((bar, i) => bar.classList.toggle('on', i < team.fouls));
    q('.bonus').classList.toggle('on', other.fouls >= state.bonusFouls);

    const img = q('.badge img');
    const src = team.logo ? 'logos/' + encodeURIComponent(team.logo) : '';
    q('.badge').style.display = src ? '' : 'none';
    if (img.dataset.want !== src) img.classList.remove('ready');
    setLogo(img, src, (shown) => img.classList.toggle('ready', shown));

    const score = q('.score');
    if (last[side] !== null && last[side] !== team.score) {
      score.classList.remove('flash');
      void score.offsetWidth;
      score.classList.add('flash');
    }
    last[side] = team.score;
    score.textContent = team.score;
  }

  // Squeezes a title horizontally when it is wider than its strip, instead of cutting it off.
  function setTitle(el, text) {
    const span = el.firstElementChild;
    el.classList.toggle('empty', !text);
    if (span.textContent === text) return;
    span.textContent = text;
    span.style.transform = '';
    const room = el.clientWidth - 24;
    if (span.offsetWidth > room) span.style.transform = 'scaleX(' + room / span.offsetWidth + ')';
  }

  function render(state) {
    $('mini').classList.toggle('hidden', state.miniVisible === false);
    $('tos').classList.toggle('on', state.timeoutsVisible !== false);

    // The run tab keeps its last text while it fades out, so it never blanks mid-fade.
    const run = state.run || { team: null, points: 0 };
    const showRun = !!state.runVisible && !!run.team && run.points > 0;
    if (showRun) {
      const secs = Math.floor((state.playedMs - run.startAt) / 1000);
      $('run').querySelector('.run-team').textContent = state[run.team].name;
      $('run').querySelector('.run-count').textContent = run.points + '-' + run.against + ' RUN';
      $('run').querySelector('.run-time').textContent =
        'IN THE LAST ' + Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    }
    $('run').classList.toggle('on', showRun);
    setTitle($('title'), state.title || '');
    showIdentity(state.identityVisible !== false);
    renderTeam('home', state.home, state.away, state);
    renderTeam('away', state.away, state.home, state);

    $('clock').textContent = formatGameClock(state.gameClockMs);
    $('clock').classList.toggle('warn', state.gameClockMs > 0 && state.gameClockMs < 10000);
    $('period').textContent = periodLabel(state.period);

    const shot = $('shot');
    shot.classList.toggle('off', !state.shotClockVisible);
    shot.textContent = formatShotClock(state.shotClockMs);
    shot.classList.toggle('warn', state.shotClockMs < 5000);
  }

  let ws = null;
  function report(text) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'log', text: 'mini: ' + text }));
  }
  window.onerror = (message, src, line) => report('ERROR ' + message + ' @ line ' + line);

  function connect() {
    ws = new WebSocket('ws://' + location.host);
    ws.onopen = () => report('viewport ' + innerWidth + 'x' + innerHeight);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') render(msg.state);
      if (msg.type === 'identity') setIdentity(msg.files);
    };
    ws.onclose = () => setTimeout(connect, RECONNECT_MS);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
